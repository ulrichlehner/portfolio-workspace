"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt for the dev container (STARSHIP_CONFIG in devcontainer.json).
# Plain Unicode symbols only, so no Nerd Font on the host. Colours: Catppuccin Mocha.
#
#   portfolio on flatex-at-kontoauszug-transfer [!?⇡1] via ☕ v21.0.12 took 3m12s
#   ❯
#
# The repos are bind mounts from the host, slow to scan: use the git executable
# (zshrc keeps the index fresh) and allow a slower first status.
scan_timeout = 200
command_timeout = 2000

palette = "catppuccin_mocha"
add_newline = true

# root is always the user here and the container is always Docker, so username
# and container are left out.
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$java\
$cmd_duration\
$line_break\
$status\
$character"""

[directory]
style = "bold lavender"
read_only = " ro"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ""
style = "bold mauve"
format = "[on](overlay1) [$branch]($style) "

[git_state]
style = "bold yellow"

[git_status]
use_git_executable = true
style = "peach"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "≡"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[java]
symbol = "☕ "
style = "red"
format = "[via](overlay1) [$symbol$version]($style) "
# Maven/Tycho builds have their poms in subfolders (portfolio-app/), not at the root.
detect_folders = ["portfolio-app"]

[cmd_duration]
min_time = 2000
style = "yellow"
format = "[took](overlay1) [$duration]($style) "

[status]
disabled = false
style = "red"
format = "[$status]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
